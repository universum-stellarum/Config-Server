spring:
  application:
    name: config-server

  security:
    user:
      name: ${CONFIG_ADMIN_USERNAME}
      password: ${CONFIG_ADMIN_PASSWORD}
      roles: ADMIN

  cloud:
    config:
      server:
        accept-empty: false

        health:
          repositories:
            identity:
              name: identity
              profiles: dev

        git:
          uri: ${CONFIG_GIT_URI}
          username: ${CONFIG_GIT_USERNAME}
          password: ${CONFIG_GIT_TOKEN}
          default-label: ${CONFIG_GIT_DEFAULT_LABEL}
          try-master-branch: false
          clone-on-start: true
          basedir: ${java.io.tmpdir}/config-server-git

  mvc:
    log-request-details: false
    log-resolved-exception: true

  web:
    error:
      include-message: never
      include-stacktrace: never

universum:
  request-log:
    enabled: ${REQUEST_LOG_ENABLED:true}

server:
  port: ${SERVER_PORT:8888}
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: false
      show-details: never
