services:
  config-server:
    image: config-server:local
    build:
      context: .
    restart: unless-stopped

    environment:
      HOME: /tmp
      JAVA_TOOL_OPTIONS: "-Duser.home=/tmp"
      SERVER_PORT: ${SERVER_PORT}
      CONFIG_GIT_URI: ${CONFIG_GIT_URI}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN}
      CONFIG_GIT_DEFAULT_LABEL: ${CONFIG_GIT_DEFAULT_LABEL}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
      CONFIG_ADMIN_USERNAME: ${CONFIG_ADMIN_USERNAME}
      CONFIG_ADMIN_PASSWORD: ${CONFIG_ADMIN_PASSWORD}

    expose:
      - "${SERVER_PORT}"

    read_only: true

    tmpfs:
      - /tmp:size=256m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: [ "CMD", "/bin/bash", "/app/healthcheck.sh" ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    networks:
      universum-dev:
        aliases:
          - config-server
      universum-prod:
        aliases:
          - config-server

networks:
  universum-dev:
    external: true
  universum-prod:
    external: true
